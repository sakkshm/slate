services:
  api-dev:
    build:
      context: .
      dockerfile: scripts/Dockerfile
      target: development
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
    environment:
      - PORT=8080
      - APP_ENV=development
    profiles:
      - dev

  api-prod:
    build:
      context: .
      dockerfile: scripts/Dockerfile
      target: production
      args:
        - ENTRYPOINT_PATH=./cmd/api
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
    profiles:
      - prod

volumes:
  go_modules: