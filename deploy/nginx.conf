# Slate nginx site config
# Frontend (dashboard/landing) is served from /var/www/slate (Vite build output).
# The API + deployment gateway run in the api-prod container, published on
# host port 8081. Deployments and reserved hosts (*.slate.sakkshm.me) proxy to
# the API so host-based routing keeps working behind nginx.

server {
    listen 80;
    listen [::]:80;
    server_name slate.sakkshm.me;

    root /var/www/slate;
    index index.html;

    # SPA fallback: /dashboard/*, /auth/github/callback must serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite; cache them hard, keep HTML fresh
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico|webp|json|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE build logs + artifact downloads must stream, not buffer
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# Everything on *.slate.sakkshm.me routes to the API: the gateway serves
# deployments and reserved hosts (api, www, dashboard, ...) fall through to it.
server {
    listen 80;
    listen [::]:80;
    server_name *.slate.sakkshm.me;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
